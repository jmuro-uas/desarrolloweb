    <h2>Formulario</h2>
    <form action="/submit-feedback" method="POST">
        <fieldset>
            <legend>Comentarios</legend>
    
            <!-- Name Field -->
            <label for="name">Nombre:</label><br>
            <input type="text" id="name" name="name" placeholder="Introduce tu nombre" required><br><br>
    
            <!-- Email Field -->
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Introduce tu email" required><br><br>
    
            <!-- Comments Field -->
            <label for="comments">Comentarios:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Comenta aquí..."></textarea><br><br>
    
            <!-- Submit Button -->
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
